name: Build Android APK & Verify iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) 质量门禁：类型检查 + 单元测试
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # 2) Android：构建 Debug APK 并上传为 Artifact
  # ─────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pwa

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangkok-floodnav-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 3) iOS：在 macOS 上做编译校验（不签名出包）
  # ─────────────────────────────────────────────────────────────
  ios:
    name: Verify iOS Build
    needs: quality
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pwa

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show available schemes
        working-directory: ios/App
        run: xcodebuild -list -project App.xcodeproj

      - name: Build iOS (no code signing, simulator)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
